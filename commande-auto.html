<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commande IKF Auto</title>
<style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #050505, #202020);
      color: #d4af37;
      padding: 35px 18px;
      text-align: center;
      border-bottom: 2px solid #d4af37;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 5vw, 36px);
      letter-spacing: 1px;
    }

    header p {
      color: #e5d8a8;
      max-width: 600px;
      margin: 0 auto;
    }

    main {
      width: calc(100% - 30px);
      max-width: 680px;
      margin: 30px auto;
      padding: 28px;
      background: #171717;
      border: 1px solid #3d3320;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
    }

    h2 {
      color: #e0bd55;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      color: #f0d783;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #0e0e0e;
      color: #fff;
      font: inherit;
      font-size: 16px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #d4af37;
      outline-offset: 1px;
      border-color: #d4af37;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button,
    .back {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 14px 18px;
      border: 1px solid #e5c45c;
      border-radius: 8px;
      background: linear-gradient(135deg, #f0d778, #c49a24);
      color: #111;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
    }

    button:hover,
    .back:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:focus-visible,
    .back:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .note {
      color: #c5c5c5;
      font-size: 14px;
      line-height: 1.7;
    }

    footer {
      padding: 20px 15px;
      text-align: center;
      color: #aaa;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      header {
        padding: 28px 15px;
      }

      main {
        margin: 20px auto;
        padding: 20px 16px;
      }
    }
</style>

</head>
<body>
  <header>
    <h1>IKF AUTO</h1>
    <p>Vente • Location • Véhicules partenaires</p>
  </header>

  <main>
    <h2>Votre demande automobile</h2>
    <p class="note">Remplissez le formulaire pour acheter, louer ou proposer un véhicule.</p>

<form id="commandeAutoForm">
  <label for="nom">Nom complet *</label>
  <input
    id="nom"
    type="text"
    autocomplete="name"
    placeholder="Votre nom et prénom"
    required
  >

  <label for="telephone">Numéro de téléphone *</label>
  <input
    id="telephone"
    type="tel"
    autocomplete="tel"
    placeholder="Ex. 77 123 45 67"
    required
  >

  <label for="besoin">Type de demande *</label>
  <select id="besoin" required>
    <option value="">Choisir une demande</option>
    <option value="Achat de véhicule">Achat de véhicule</option>
    <option value="Location de véhicule">Location de véhicule</option>
    <option value="Véhicule partenaire">Véhicule d'un partenaire</option>
    <option value="Proposer un véhicule">Proposer mon véhicule</option>
  </select>

  <label for="marque">Marque du véhicule</label>
  <input
    id="marque"
    type="text"
    placeholder="Ex. Toyota, Hyundai, Mercedes..."
  >

  <label for="modele">Modèle recherché</label>
  <input
    id="modele"
    type="text"
    placeholder="Ex. Corolla, Tucson, Classe C..."
  >

  <label for="annee">Année du véhicule souhaitée</label>
  <input
    id="annee"
    type="number"
    min="1980"
    max="2035"
    placeholder="Ex. 2022"
  >

  <label for="boite">Boîte de vitesses</label>
  <select id="boite">
    <option value="">Sans préférence</option>
    <option value="Manuelle">Manuelle</option>
    <option value="Automatique">Automatique</option>
  </select>

  <label for="carburant">Type de carburant</label>
  <select id="carburant">
    <option value="">Sans préférence</option>
    <option value="Essence">Essence</option>
    <option value="Diesel">Diesel</option>
    <option value="Hybride">Hybride</option>
    <option value="Électrique">Électrique</option>
    <option value="GPL">GPL</option>
  </select>

  <label for="lieu">Ville ou lieu souhaité</label>
  <input
    id="lieu"
    type="text"
    placeholder="Ex. Dakar, Keur Massar..."
  >

  <label for="details">Détails de votre demande *</label>
  <textarea
    id="details"
    rows="5"
    required
    placeholder="Précisez l'état souhaité, la durée de location ou les autres caractéristiques..."
  ></textarea>

  <label for="budget">Budget indicatif (FCFA)</label>
  <input
    id="budget"
    type="number"
    min="0"
    step="1000"
    placeholder="Ex. 5000000"
  >

  <label for="paiement">Préférence de paiement</label>
  <select id="paiement">
    <option value="À discuter">À discuter</option>
    <option value="Wave">Wave</option>
    <option value="Orange Money">Orange Money</option>
    <option value="Espèces">Espèces</option>
    <option value="Virement bancaire">Virement bancaire</option>
  </select>

  <p class="note">
    Vérifiez vos coordonnées et décrivez votre besoin avec précision
    pour nous aider à traiter votre demande.
  </p>

  <button id="envoyer" type="submit">Envoyer ma demande Auto</button>
</form>


    <a class="back" href="index.html">Retour au site IKF</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://dwioklrcpbhzhdfmcnqn.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fdqw0PEcQbtaUePE1OxWBg_xzP-vNP-";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    document.getElementById("commandeAutoForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const nom = document.getElementById("nom").value.trim();
      const telephone = document.getElementById("telephone").value.trim();
      const typeDemande = document.getElementById("besoin").value;
      
      const marque = document.getElementById("marque").value.trim();
      const modele = document.getElementById("modele").value.trim();
      const annee = document.getElementById("annee").value;
      const boite = document.getElementById("boite").value;
      const carburant = document.getElementById("carburant").value;
      const lieu = document.getElementById("lieu").value.trim();

      const details = document.getElementById("details").value.trim();
      const budget = document.getElementById("budget").value;
      const paiement = document.getElementById("paiement").value;
      const bouton = document.getElementById("envoyer");

      if (!nom || !telephone || !typeDemande || !details) {
        alert("Veuillez remplir les champs obligatoires.");
        return;
      }

      const lignes = [
        "Bonjour IKF Auto, je souhaite présenter une demande.",
        "",
        "Nom : " + nom,
        "Téléphone : " + telephone,
        "Service : Auto",
        "Type : " + typeDemande,
        "Service : Auto",
        "Type : " + typeDemande,
        "Marque : " + (marque || "Non précisée"),
        "Modèle : " + (modele || "Non précisé"),
        "Année : " + (annee || "Non précisée"),
        "Boîte de vitesses : " + (boite || "Sans préférence"),
        "Carburant : " + (carburant || "Sans préférence"),
        "Ville ou lieu : " + (lieu || "Non précisé"),
        "Détails : " + details,
        "Détails : " + details,
        "Budget : " + (budget ? budget + " FCFA" : "Non précisé"),
        "Paiement : " + paiement
      ];

      const urlWhatsApp = "https://wa.me/221703311532?text=" + encodeURIComponent(lignes.join("\n"));
      bouton.disabled = true;

      try {
        const { error } = await db.from("commandes").insert([{
          nom_client: nom,
          telephone: telephone,
          service: "auto",
          type_commande: typeDemande,
          details: "Marque : " + (marque || "Non précisée") +
          " | Modèle : " + (modele || "Non précisé") +
          " | Année : " + (annee || "Non précisée") +
          " | Boîte : " + (boite || "Sans préférence") +
          " | Carburant : " + (carburant || "Sans préférence") +
          " | Ville ou lieu : " + (lieu || "Non précisé") +
          " | Demande : " + details,
          budget: budget ? budget + " FCFA" : "",
          mode_paiement: paiement,
          statut: "Nouvelle"
        }]);

        if (error) {
          console.error(error);
          alert("La demande Auto n'a pas été enregistrée : " + error.message);
          return;
        }

        if (confirm("Votre demande IKF Auto est enregistrée ! Ouvrir WhatsApp maintenant ?")) {
          window.location.href = urlWhatsApp;
        } else {
          alert("Votre demande est enregistrée. Merci !");
        }
      } catch (erreur) {
        console.error(erreur);
        alert("Erreur de connexion. Veuillez réessayer.");
      } finally {
        bouton.disabled = false;
      }
    });
  </script>
</body>
</html>
